apiVersion: 1

# InfluxDB 3 Core datasource.
#
# Notes that are easy to get wrong:
#  - Query language MUST be SQL. Flux is not supported on InfluxDB 3.x.
#  - "Product" is InfluxDB Enterprise 3.x even for Core: the Core-specific
#    option does not exist in the dropdown yet. This is expected behaviour.
#  - SQL goes over Flight SQL (gRPC), which needs HTTP/2. Grafana talks
#    directly to influxdb over the compose network, so no proxy is involved.
#  - "Insecure Connection" is required because there is no TLS on localhost.
#  - SQL mode uses the token; InfluxQL mode uses a username + token as password.

datasources:
  - name: InfluxDB-3
    uid: influxdb3-solar
    type: influxdb
    access: proxy
    url: https://influxdb:8181
    # Set both forms. Grafana's API maps the top-level `database` into
    # jsonData.database, but the InfluxQL-style fields are what the UI writes,
    # and the Flight SQL path is sensitive to the difference.
    database: solar
    user: grafana
    isDefault: true
    editable: true
    jsonData:
      # Must be SQL. Flux is not supported on InfluxDB 3.x.
      version: SQL
      # "Enterprise 3.x" is the correct selection for a Core instance; there is
      # no Core-specific option in the dropdown.
      product: InfluxDB Enterprise
      database: solar
      httpMode: POST
      timeout: 60
      # TLS trust for the Flight SQL path comes from SSL_CERT_FILE (see the
      # grafana service in docker-compose.yml). This key only affects Grafana's
      # plain-HTTP client, which the SQL path does not use.
      insecureSkipVerify: true
    # Grafana provisioning expands ${VAR} from the container environment and
    # cannot read a file. InfluxDB 3 Core 3.11 has NO permission-scoped
    # database tokens, so this resolves to the admin token from .env. The
    # per-component token files under secrets/ provide attribution and
    # independent revocation, not least privilege. See docs/04-security.md.
    secureJsonData:
      token: ${INFLUX_ADMIN_TOKEN}

# ---------------------------------------------------------------------------
# RESOLVED (verified, not assumed)
# ---------------------------------------------------------------------------
# This datasource previously failed every query with:
#
#   flightsql: rpc error: code = InvalidArgument
#   desc = no 'database' header in request
#
# Reproduced on Grafana 12.2.0 and 12.4.0. It is now working, and no manual UI
# step is required. The cause was the top-level `database` field: Grafana's
# InfluxDB datasource sends it as a gRPC metadata header on the Flight SQL
# path, and it has to be set at the top level, not only inside jsonData. The
# provisioning file above sets both. Verified by:
#
#   * GET /api/datasources/uid/influxdb3-solar/health  -> {"message":"OK"}
#   * POST /api/ds/query with a real SELECT            -> rows returned
#   * a full `docker compose restart grafana`, so the result comes from this
#     file rather than from state a previous UI session left in Grafana's DB.
#
# Dashboards are in ./grafana/dashboards and are provisioned from there.
