# ---------------------------------------------------------------------------
# Events -> events
#
# `severity` and `source` are TAGS in the events table, so they must appear in
# the payload for json_v2 to pick them up as tags rather than fields.
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["solar/+/events"]
  # QoS 1: losing an alarm is not acceptable, unlike a telemetry sample.
  qos = 1
  topic_tag = ""
  client_id = "telegraf-events"
  name_override = "events"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "site"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "severity"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "code"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "message"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "threshold"
      type = "float"
      optional = true

# ---------------------------------------------------------------------------
# InfluxDB 3 Core output.
#
# Telegraf 1.36 has no outputs.influxdb_v3 plugin, so this uses the v2
# compatibility API (POST /api/v2/write?bucket=...). `bucket` is the only
# database selector this plugin sends and InfluxDB 3 Core honors it.
#
# There is no DISK buffer: this plugin exposes no `buffer_limit` and Telegraf
# 1.36 ships no outputs.disk plugin. `metric_buffer_limit` in [agent] above is
# in-memory only, so metrics survive a database outage but not a Telegraf
# restart. See docs/02-architecture.md section 6.
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  # The InfluxDB certificate is self-signed (scripts/gen-tls-cert.sh), so pin
  # the CA to it. Verifying against a known cert is better than
  # insecure_skip_verify = true, which is what the first attempt used.
  tls_ca = "/run/secrets/tls/server.crt"
  token = "${INFLUX_WRITE_TOKEN}"
  bucket = "${INFLUX_DB}"
  timeout = "10s"
  log_level = "warn"

# Telegraf's own internal metrics are served on :8094/metrics and are
# deliberately NOT routed to InfluxDB, to keep them out of the solar database.
