# Telegraf: MQTT -> InfluxDB 3 Core
#
# Decouples the simulator from the database: if InfluxDB is unavailable the
# simulator keeps publishing and the live dashboard (which reads MQTT directly)
# keeps working.
#
# ---------------------------------------------------------------------------
# HOW MESSAGES ARE ROUTED TO TABLES
# ---------------------------------------------------------------------------
# The measurement name comes from `name_override`, one input block per table.
# The tags come from json_v2 `tag` entries that read identity fields OUT OF THE
# JSON PAYLOAD, so messages are self-describing.
#
# An earlier design extracted identity from the MQTT topic using
# `topic_parsing`. That was abandoned: topic_parsing requires `tags` and
# `measurement` to be comma-separated lists whose length exactly matches the
# topic, and its validation misreported "measurement length does not equal
# topic length" on configs that were provably correct. The topic still carries
# the identity (for subscribing and for humans reading the broker), but
# ingestion does not depend on parsing it.
#
# Consequences:
#   * A subscriber can select by topic prefix as before.
#   * The payload repeats identity that the topic already has. Slight
#     redundancy, traded for a config mechanism that actually works.
#
# ---------------------------------------------------------------------------
# WHY json_v2 AND NOT json
# ---------------------------------------------------------------------------
# The `json` parser coerces ALL numbers to float64 and silently DISCARDS
# booleans. That would break the `clipping:bool` and `status_code:int64`
# columns without any error. json_v2 preserves types and accepts explicit
# `type` declarations, which matters because InfluxDB 3 columns are typed.
#
# ---------------------------------------------------------------------------
# WHY EVERY FIELD IS `optional = true`
# ---------------------------------------------------------------------------
# json_v2 paths are REQUIRED by default, and a missing path is a hard error that
# discards the entire point -- not just that field. So one absent optional
# reading would throw away an otherwise valid sample.
#
# Tags are deliberately left REQUIRED. Identity must be present on every point;
# if it is not, the point is meaningless and should be rejected loudly rather
# than silently written with a null tag. That is a schema-contract violation and
# the tests in the Testing doc assert it never happens.

[agent]
  # Do not add a `host` tag. It is not in the schema, it would be an extra
  # immutable tag column, and it would multiply series cardinality.
  # The option is `omit_hostname`, not `omit_host`.
  omit_hostname = true
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 1000
  # In-memory only. Survives a database outage as long as Telegraf stays up,
  # but NOT a Telegraf restart: there is no disk buffer in Telegraf 1.36
  # (no buffer_limit on outputs.influxdb_v2, no outputs.disk plugin).
  metric_buffer_limit = 10000
  quiet = false

# ---------------------------------------------------------------------------
# Inverter telemetry -> inverter_telemetry
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["solar/+/block/+/inverter/+/telemetry"]
  qos = 0
  # mqtt_consumer defaults topic_tag to "topic", which would add a tag column
  # that is not in the schema. Because InfluxDB 3 tag definitions are
  # immutable, letting that happen means dropping and re-ingesting the table.
  topic_tag = ""
  client_id = "telegraf-inverter"
  name_override = "inverter_telemetry"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "site"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "block"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "inverter_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "model"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ac_power_w"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dc_power_w"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ac_voltage_v"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ac_current_a"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dc_voltage_v"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dc_current_a"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "efficiency"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "heatsink_temp_c"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "internal_temp_c"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_s"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "status_code"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "clipping"
      type = "bool"
      optional = true

