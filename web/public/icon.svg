<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Solar farm">
  <rect width="512" height="512" rx="96" fill="#0b1220"/>
  <!-- sun -->
  <circle cx="256" cy="176" r="56" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="86" x2="256" y2="58"/>
    <line x1="256" y1="266" x2="256" y2="294"/>
    <line x1="166" y1="176" x2="138" y2="176"/>
    <line x1="346" y1="176" x2="374" y2="176"/>
    <line x1="192" y1="112" x2="172" y2="92"/>
    <line x1="320" y1="112" x2="340" y2="92"/>
  </g>
  <!-- array: three tilted panels, echoing the 30 deg tilt in the model -->
  <g fill="#38bdf8">
    <rect x="72"  y="330" width="110" height="78" rx="8" transform="rotate(-18 127 369)"/>
    <rect x="201" y="330" width="110" height="78" rx="8" transform="rotate(-18 256 369)"/>
    <rect x="330" y="330" width="110" height="78" rx="8" transform="rotate(-18 385 369)"/>
  </g>
  <rect x="64" y="432" width="384" height="14" rx="7" fill="#475569"/>
</svg>
