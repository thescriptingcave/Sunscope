[project]
name = "solar-sim"
version = "0.1.0"
description = "Physics-based solar farm simulator publishing telemetry over MQTT"
requires-python = ">=3.12"
dependencies = [
    "pvlib>=0.13",
    "numpy>=2.0",
    "paho-mqtt>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
solar-sim = "solar_sim.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running MQTT broker and InfluxDB",
    "load: slow; run nightly",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
